[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapis-control-suite"
version = "0.1.0"
description = "Device control and measurement workflows for the LAPIS setup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyVISA>=1.14",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "matplotlib>=3.7", "nbformat>=5"]
gui = ["PySide6>=6.6"]

[project.gui-scripts]
lapis-control = "lapis_control.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lapis_control*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.md", "*.ipynb", "*.txt", "*.ps1"]
